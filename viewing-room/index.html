<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
  <title>In the garden · All Dogs</title><link rel="canonical" href="https://alldogs.wtf/viewing-room/">
  <link rel="stylesheet" href="/gate.css?v=20260918-wide1">
  <link rel="stylesheet" href="/painting/painted.css?v=20260918-wide1">
  <script src="/account/account-api.js?v=20260917-club1" defer></script>
  <script src="/viewing-room/garden/garden.js?v=20260919-wide-original1" defer></script>
  <script src="/account/account.js?v=20260919-wide-original1" defer></script>
<link rel="stylesheet" href="/site.css?v=20260918-polish1">
  <link rel="stylesheet" href="/viewing-room/garden/garden.css?v=20260919-wide-original1">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body data-account-page="viewing-room" data-garden-state="waiting">
  <header class="garden-mast">
    <a class="wordmark" href="/" aria-label="All Dogs home"><img src="/painting/wordmark.webp" alt="All Dogs" width="436" height="92"></a>
    <a class="garden-exit" href="/"><img src="/painting/return.webp" alt="Back to the gate" width="510" height="61"></a>
  </header>
  <main class="garden-main">
    <h1 class="visually-hidden">Your private invitation to All Dogs</h1>
    <div class="garden-stage" id="garden-stage" role="region" aria-label="Wubbushi’s garden">
      <div class="garden-layer garden-ground" data-garden-paint="ground" aria-hidden="true"><img src="/viewing-room/garden/ground.webp" width="1600" height="1000" alt=""><canvas></canvas></div>
      <button class="garden-dog" id="garden-dog" type="button" hidden aria-label="See your original painting"><img id="garden-dog-image" alt=""></button>
      <div class="garden-layer garden-foreground" data-garden-paint="foreground" aria-hidden="true"><img src="/viewing-room/garden/foreground.webp" width="1600" height="1000" alt=""><canvas></canvas></div>
    </div>
    <div class="garden-letter" id="garden-invitation">
      <p id="account-message" class="account-message" role="status" aria-live="polite">Opening your invitation…</p>
      <section id="account-gate" class="account-gate" hidden aria-labelledby="gate-title">
        <p class="garden-eyebrow"><img class="invitation-word" src="/viewing-room/garden/gardenInvitation.webp" width="570" height="86" alt="Your invitation"></p>
        <h2 id="gate-title">Make yourself at home.</h2><p id="gate-copy"></p>
        <a id="account-login" class="garden-login" hidden>Sign in with X ↗</a>

      </section>
      <div id="account-content"></div>
      <noscript><p>Turn on JavaScript to open your personal invitation. <a href="/">Return to the gate.</a></p></noscript>
    </div>
  </main>
  <footer class="garden-footer">
    <nav aria-label="Your All Dogs account"><a href="/lounge/">Your account</a><a href="/my-dog/">My dog</a><a href="/dog-pound/">My wishlist</a><a href="/waitlist/">The waitlist</a></nav>
    <button class="text-button" id="account-logout" type="button" hidden>Sign out</button>
    <p><img src="/painting/signature.webp" width="390" height="90" alt="Wubbushi"></p>
  </footer>
  <dialog id="painting-lightbox" class="garden-lightbox" aria-label="Your original painting"><button type="button" id="close-painting" class="text-button" aria-label="Close painting">Close ×</button><img id="large-painting" alt=""><p>The original painting.</p></dialog>
</body>
</html>
