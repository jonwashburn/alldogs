<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Botanist · Uprights</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeeae2;color:#292821;font:16px/1.5 system-ui,sans-serif}header,main{max-width:1080px;margin:auto;padding:28px 30px}header{display:flex;gap:24px;align-items:baseline;justify-content:space-between}h1{font-size:22px;font-weight:550;letter-spacing:-.5px;margin:0}a{color:inherit;text-underline-offset:4px}main{display:grid;grid-template-columns:1fr;gap:32px;padding-top:0}figure{margin:0}img{display:block;width:100%;height:auto}button{font:inherit;color:inherit;background:transparent;border:1px solid #938e81;padding:8px 14px;cursor:pointer}button:hover{background:#ded9cf}figcaption{padding:18px 0 24px}h2{font-size:20px;margin:0 0 4px;font-weight:550}p{margin:0 0 14px;color:#5c574e}nav{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.art{border:0;padding:0;width:100%;display:block;background:none;cursor:zoom-in}dialog{border:0;padding:0;background:#e7e2d8;max-width:none;width:100vw;max-height:none;height:100vh}dialog::backdrop{background:#222c}.toolbar{padding:14px 20px;display:flex;gap:12px;align-items:center;position:sticky;top:0;background:#e7e2d8;z-index:1}.toolbar span{margin-right:auto}.viewer{height:calc(100vh - 78px);overflow:auto;display:flex;align-items:flex-start;justify-content:center}.viewer img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}.viewer.actual{display:block}.viewer.actual img{width:1000px;height:1000px;max-width:none;max-height:none;margin:auto}@media(max-width:800px){header{padding:20px;display:block}header a{display:inline-block;margin-top:12px}main{grid-template-columns:1fr;padding:0 14px;gap:10px}.toolbar{gap:8px;padding:10px}.toolbar span{font-size:13px}.toolbar button{padding:7px}.viewer{height:calc(100vh - 66px)}}
</style>
<header><h1>The Botanist</h1><a href="/loop/">Back to the Loop</a></header>
<main>
<figure><button class="art" data-image="botanist.png" data-title="The Botanist" aria-label="Enlarge The Botanist"><img src="botanist.png" width="1000" height="1000" alt="Upright figure with a pale rubbed face, unequal dark eyes, chestnut hair and an olive coat, holding one blue flower against cool cotton."></button><figcaption><h2>The Botanist</h2><p>A small flower for a long day.</p><nav><button class="art-link" onclick="document.querySelector('.art').click()">View larger</button><a href="botanist.png" target="_blank" rel="noopener">Open original</a><a href="../skin-stick-20260912/">Earlier skin studies</a></nav></figcaption></figure>
</main>
<dialog id="zoom"><div class="toolbar"><span id="art-title"></span><button id="fit">Fit</button><button id="actual">100%</button><button id="close">Close</button></div><div class="viewer" id="viewer"><img id="large" alt="Enlarged painting"></div></dialog>
<script>
const dialog=document.querySelector('#zoom'),viewer=document.querySelector('#viewer');for(const button of document.querySelectorAll('.art'))button.onclick=()=>{document.querySelector('#large').src=button.dataset.image;document.querySelector('#art-title').textContent=button.dataset.title;viewer.classList.remove('actual');dialog.showModal()};document.querySelector('#fit').onclick=()=>viewer.classList.remove('actual');document.querySelector('#actual').onclick=()=>viewer.classList.add('actual');document.querySelector('#close').onclick=()=>dialog.close();
</script></html>
