<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --paper: #fdfdfb; --ink: #111111; --hair: #dddad0; --blue: #2c5cff; --red: #ff3b2f; --gold: #f0b429; }
  html, body { background: var(--paper); color: var(--ink); }
  body { font-family: "Instrument Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; line-height: 1.5; }
  h1 { font-family: "Shantell Sans", "Instrument Sans", sans-serif; font-weight: 800; text-transform: uppercase; }
  ::selection { background: var(--gold); color: var(--ink); }
  a { color: inherit; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 28px; }
  .top { padding-top: 40px; padding-bottom: 22px; border-bottom: 1px solid var(--ink); }
  .kicker { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; font-weight: 700; opacity: .7; }
  .kicker a { text-decoration: none; }
  .kicker a:hover { text-decoration: underline; }
  .top h1 { font-size: clamp(34px, 6vw, 72px); line-height: 0.98; margin-top: 10px; }
  .top h1 em { font-style: normal; color: var(--red); }
  .top p { margin-top: 16px; max-width: 720px; font-size: clamp(15px, 1.8vw, 17px); opacity: .8; }
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; padding: 28px 0 64px; }
  .pic { display: block; background: #eeebe3; color: inherit; text-decoration: none; }
  .pic img { display: block; width: 100%; height: auto; aspect-ratio: 1; }
  .pic span { display: block; font-size: 12px; padding: 6px 2px 0; opacity: .55; }
  .pic:hover img { outline: 2px solid var(--ink); outline-offset: 0; }
  .foot { padding-bottom: 56px; font-size: 12px; opacity: .55; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 520px) { .wrap { padding: 0 16px; } .grid { grid-template-columns: repeat(2, 1fr); } }
