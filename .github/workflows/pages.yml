name: Publish All Dogs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Check public JavaScript syntax
        run: |
          node --check dog-pound/adoption-form.js
          node --check dog-pound/review/review.js
          node --check most-valuable/values.js
          node --check dog-pound/application/application.js
          node .github/scripts/check-vouch.cjs
      - name: Build the existing static site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Add shareable short-link pages
        # The Jekyll container creates a root-owned output directory on the runner.
        run: sudo python3 .github/scripts/build-vouch-pages.py _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
