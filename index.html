  <template id="copy-work"><p class="eyebrow">The work</p><h2 id="reading-title">The drawings that would have been on the fridge.</h2><p>ALL DOGS comes from the same childhood as <a href="https://exaltedlove.com/" target="_blank" rel="noopener noreferrer">HOLY</a>, my collection about the photographs we lost. I wrote a program to paint the way a kid paints: a fat outline, paint running out mid-stroke, an eye a little wrong. These are the drawings that would have been on the fridge.</p><p>The albums would not have brought anyone back either. You make the record anyway. I can paint the dog. Its collar records who held on to it: your handle from the first day, and whether you kept the dog or sold it.</p><h3>The paint is code.</h3><p>I've been building a brush in code. Each bristle carries a finite amount of paint, picks up what's still wet and leaves a mark where it touches the surface. Long strokes run dry. I write each dog's composition into the painter: its face, clothes, pose and the world around it.</p><p class="signature"><span class="painted " data-paint="signature"><img src="/painting/signature.webp" alt="" aria-hidden="true"><canvas aria-hidden="true"></canvas><span class="sr-only">Wubbushi</span></span></p><p><a href="/about/">The childhood and the brush ↗</a></p></template>
  <template id="copy-note"><p class="eyebrow">A note from Wubbushi</p><h2 id="reading-title">I can still paint the dogs.</h2><p>This is a journal for me. A history of who I meet and make friends with, ideally for the rest of my life. A chance to make a little custom artwork for the people in my life, as a gift from me.</p><p>ALL DOGS comes from the same childhood. I wrote a program to paint the way a kid paints: a fat outline, paint running out mid-stroke, an eye a little wrong. These are the drawings that would have been on the fridge, made now by a machine I spend my afternoons teaching.</p><p>The albums would not have brought anyone back either. You make the record anyway. I can paint the dog. Its collar records who held on to it: your handle from the first day, and whether you kept the dog or sold it.</p><p class="signature"><span class="painted " data-paint="signature"><img src="/painting/signature.webp" alt="" aria-hidden="true"><canvas aria-hidden="true"></canvas><span class="sr-only">Wubbushi</span></span></p></template>
  <template id="copy-record"><p class="eyebrow">The collar</p><h2 id="reading-title">A name tag with a memory.</h2><p>The collar records who adopted the dog and what happened to it. That history stays with the dog through every change: living, zombie, immortal or angel.</p><dl class="record"><div><dt>Original painting</dt><dd>Barack</dd></div><div><dt>Artist</dt><dd>Wubbushi</dd></div></dl><p><a href="/my-dog/">Visit your dog and its record ↗</a></p><p>A rescue adds a new entry; it never erases the infection. The dog's original artwork reference stays on record too, whatever name you choose.</p></template>
  <template id="copy-life"><p class="eyebrow">A life together</p><h2 id="reading-title">Holding on.</h2><p>Living dogs can become angels.</p><img class="angel" src="/assets/barack-angel-blue-hour-wide-2400.jpg" alt="Barack as an angel with white wings and a fine golden halo against a blue evening ground." width="2400" height="1200"><p>Every eligible living dog has a 1 in 1,600 chance of natural death each day (0.0625%). The dog becomes an angel, and you keep the artwork. Its lifespan and cause of death stay in the record.</p><p>Natural death does not spread infection. Holding on to your dog prevents a sale; it cannot guarantee a long life.</p><h3>To sell your dog, you have to kill it.</h3><p>Sell a living dog and it dies, coming back as a zombie. Each new zombie has a <strong>50% chance</strong> of killing someone else's dog and turning it into a zombie too. That dog gets the same chance. And so on.</p><p>You get the money. Another collector can lose the dog they loved. Your sale and your name stay on every dog it reaches.</p><p>On its first resale, a dog has a 1 in 20 chance to resist and become immortal. Holding on cannot prevent infection or natural death.</p><p><a href="/adoption/">Read the collection rules ↗</a></p></template>
  <template id="copy-journal"><p class="eyebrow">The journal</p><h2 id="reading-title">You make the record anyway.</h2><p>This is a journal for me. A history of who I meet and make friends with, ideally for the rest of my life. A chance to make a little custom artwork for the people in my life, as a gift from me.</p><p>The albums would not have brought anyone back either. You make the record anyway. I can paint the dog.</p><div class="journal-entry"><span>From the artist's note</span><p>“Its collar records who held on to it: your handle from the first day, and whether you kept the dog or sold it.”</p></div><p><a href="/about/">Read the artist's note ↗</a></p></template>
